spring.application.name=School Timetable and Attendance Management System

# Import optional local credentials (ignored by git, stays only on your local machine)
spring.config.import=optional:classpath:application-local.properties

# ---------- Server ----------
server.port=8080

# ---------- PostgreSQL Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:SchoolAttendanceJwtSecretKeyChangeMe1234567890}

# ---------- API Documentation ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Multipart File Upload ----------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB